# CE BetterTrader — Render Free + Supabase
# El servicio gratuito no tiene disco persistente: whitelist, pagos,
# comunidad y feedback deben usar Supabase para sobrevivir a reinicios.
services:
  - type: web
    name: ce-bettertrader
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: ACCESS_CONTROL
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: ALLOW_SERVER_SIDE_TRADING
        value: "false"
      - key: HELIUS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_WALLETS
        sync: false
      - key: MERCHANT_WALLET
        sync: false
      - key: ACCESS_PRICE_SOL
        value: "0.1"
      - key: ACCESS_DURATION_DAYS
        value: "30"
      - key: CORS_ORIGINS
        sync: false
